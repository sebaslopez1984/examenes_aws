<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Practitioner (CLF-C02) - Practice Exam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layout">
<div class="container">
    <div class="header">
        <span class="title">AWS CLF-C02 Practice Exam</span>
        <select class="exam-selector" id="exam-selector" onchange="changeExam(this.value)">
            <option value="">Cargando exámenes...</option>
        </select>
        <span class="status-badge" id="progress-text">Cargando preguntas...</span>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-body">
        <div class="question-text" id="question-text"></div>
        <div class="options-list" id="options-container"></div>

        <div class="hint-box" id="hint-box">
            💡 <strong>Pista:</strong> <span id="hint-text"></span>
        </div>

        <div class="explanation-box" id="explanation-box">
            📘 <strong>Aclaración / Explicación:</strong> <span id="explanation-text"></span>
        </div>

        <div class="actions">
            <button class="btn btn-warning" id="flag-btn" onclick="toggleFlag()">🔖 Marcar para revisar</button>
            <button class="btn btn-secondary" id="hint-btn" onclick="toggleHint()">Mostrar Pista 💡</button>
            <button class="btn btn-secondary" id="previous-btn" onclick="previousQuestion()" style="display:none;">⬅️ Anterior</button>
            <button class="btn btn-primary" id="submit-btn" onclick="checkAnswer()">Confirmar Respuesta</button>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none;">Siguiente ➡️</button>
            <button class="btn btn-secondary" id="return-results-btn" onclick="returnToResults()" style="display:none;">Volver a preguntas para revisar</button>
            <button class="btn btn-reset" onclick="resetProgress()">Reiniciar Examen 🔄</button>
        </div>

        <div class="flagged-container">
            <strong>Preguntas marcadas para revisar:</strong>
            <span id="flagged-tags">Ninguna</span>
        </div>
    </div>

    <div id="results-body" style="display:none;"></div>
</div>

<div class="nav-panel">
    <h3>Navegación de preguntas</h3>
    <div class="nav-summary" id="nav-summary">0 de 0 respondidas</div>
    <div class="nav-grid" id="nav-grid"></div>
    <div class="nav-legend">
        <span><span class="legend-dot legend-correct"></span> Correcta</span>
        <span><span class="legend-dot legend-incorrect"></span> Incorrecta</span>
        <span><span class="legend-dot legend-flagged"></span> Marcada para revisar</span>
        <span><span class="legend-dot legend-pending"></span> Pendiente</span>
    </div>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
